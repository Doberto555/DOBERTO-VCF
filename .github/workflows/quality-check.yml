name: Quality Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check high severity dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -e
          node --check server.js
          find api lib public/js -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Verify Google stays sign-in only
        shell: bash
        run: |
          set -e
          if grep -R --line-number --fixed-strings "https://www.googleapis.com/auth/contacts" api lib public/js server.js; then
            echo "Deprecated Google Contacts scope detected in runtime code."
            exit 1
          fi
          if grep -R --line-number --fixed-strings "google_connections" api lib public/js; then
            echo "Removed Google Contacts storage detected in active modular runtime."
            exit 1
          fi
          grep -q "scope: 'openid email profile'" lib/google-sync.js

      - name: Verify removed and insecure surfaces stay removed
        shell: bash
        run: |
          set -e
          if find api -maxdepth 1 -type f \( -name 'vip-*.js' -o -name 'admin-vip-*.js' -o -name 'vcf-bot-notify.js' \) | grep -q .; then
            echo "Retired VIP/payment or legacy bot endpoint returned to production."
            exit 1
          fi
          if find public/js public/css -maxdepth 1 -type f \( -name '*vip*.js' -o -name '*vip*.css' \) | grep -q .; then
            echo "Retired VIP frontend asset returned to production."
            exit 1
          fi
          test ! -f lib/vip-api.js
          test ! -f public/owner-access.html
          test ! -f middleware.js
          grep -q 'oauth_nonce' api/google-login-url.js
          grep -q 'oauth_nonce' api/google-callback.js
          grep -q 'admin_login_guard_check' api/admin-login-secure.js
          grep -q 'register-secure' vercel.json
          grep -q 'feature-removed' vercel.json
          if grep -R --line-number -E 'MonCash|MONCASH' public/admin.html public/js/admin-*.js api/admin-system-health.js; then
            echo "Retired payment references detected in active admin surfaces."
            exit 1
          fi

      - name: Prevent secrets and insecure bridge URLs in public code
        shell: bash
        run: |
          set -e
          if grep -R --line-number -E 'SUPABASE_SERVICE_ROLE_KEY|ONESIGNAL_REST_API_KEY|GOOGLE_CLIENT_SECRET|ADMIN_PASSWORD|JWT_SECRET' public; then
            echo "Server secret identifier found in public assets."
            exit 1
          fi
          matches="$(grep -R --line-number -E 'http://([0-9]{1,3}\.){3}[0-9]{1,3}' api lib public server.js || true)"
          bad="$(printf '%s\n' "$matches" | grep -v -E 'http://127\.0\.0\.1(:[0-9]+)?' | sed '/^$/d' || true)"
          if [ -n "$bad" ]; then
            printf '%s\n' "$bad"
            echo "Insecure non-loopback direct-IP HTTP endpoint found in runtime code."
            exit 1
          fi

      - name: Verify required production files
        shell: bash
        run: |
          test -f public/index.html
          test -f public/register.html
          test -f public/privacy.html
          test -f public/terms.html
          test -f public/manifest.webmanifest
          test -f public/robots.txt
          test -f public/sitemap.xml
          test -f public/css/register-polish-v34.css
          test -f public/js/register-polish-v34.js
          test -f public/css/admin-dashboard-v33.css
          test -f public/js/admin-dashboard-v33.js
          test -f vercel.json


      - name: Verify VPS and serverless auth stay aligned
        shell: bash
        run: |
          set -e
          grep -q "googleLoginUrlHandler" server.js
          grep -q "googleCallbackHandler" server.js
          grep -q "registerSecureHandler" server.js
          grep -q "adminLoginSecureHandler" server.js
          if grep -q "google_connections" server.js; then
            echo "Legacy Google Contacts runtime detected in server.js."
            exit 1
          fi
          if grep -q "syncUser(" server.js; then
            echo "Legacy Google Contacts sync runtime detected in server.js."
            exit 1
          fi
          if grep -q "runAutoSync(" server.js; then
            echo "Legacy Google Contacts auto-sync runtime detected in server.js."
            exit 1
          fi
          grep -q "purpose !== 'admin_session'" server.js
          grep -q "purpose==='admin_session'" api/admin-system-health.js
