name: Quality Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -e
          node --check server.js
          node --check middleware.js
          find api lib public/js -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Verify Google stays sign-in only
        shell: bash
        run: |
          set -e
          if grep -R --line-number --fixed-strings "https://www.googleapis.com/auth/contacts" api lib public/js server.js; then
            echo "Deprecated Google Contacts scope detected in runtime code."
            exit 1
          fi
          if grep -R --line-number --fixed-strings "google_connections" api lib public/js server.js; then
            echo "Removed Google Contacts storage detected in runtime code."
            exit 1
          fi
          grep -q "scope: 'openid email profile'" lib/google-sync.js

      - name: Verify required production files
        shell: bash
        run: |
          test -f public/index.html
          test -f public/register.html
          test -f public/privacy.html
          test -f public/terms.html
          test -f public/manifest.webmanifest
          test -f public/robots.txt
          test -f public/sitemap.xml
          test -f vercel.json
