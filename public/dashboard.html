<!doctype html>
<html lang="ht">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>DOBERTO VCF — Dashboard</title>
<meta name="theme-color" content="#06080b" />
<link rel="icon" type="image/png" sizes="192x192" href="icons/doberto-vcf-192.png" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root{--bg:#06080b;--card:#0c1117;--line:rgba(255,255,255,.08);--txt:#eef2f0;--mut:#8b97a0;--acc:#5eead4;--acc2:#2dd4a8;--err:#ff8a8a}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:radial-gradient(1200px 500px at 70% -10%,rgba(45,212,168,.08),transparent),var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;padding-top:env(safe-area-inset-top,0px)}
.app{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:100vh}
.side{border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;padding:0 6px;color:inherit;text-decoration:none}
.brand img{width:38px;height:38px;border-radius:11px}
.ucard{border:1px solid var(--line);border-radius:18px;padding:14px;background:rgba(255,255,255,.02)}
.urow{display:flex;gap:12px;align-items:center}.urow img{width:46px;height:46px;border-radius:50%;object-fit:cover;background:#111}
.urow b{display:block;font-size:15px}.urow span{display:block;font-size:12px;color:var(--mut);word-break:break-all}
.chip{display:inline-block;margin-top:10px;padding:5px 10px;border-radius:999px;font-size:10.5px;font-weight:800;letter-spacing:.06em;border:1px solid rgba(94,234,180,.35);color:var(--acc)}
.chip.off{border-color:var(--line);color:var(--mut)}
.nav-h{font-size:10.5px;letter-spacing:.14em;color:var(--mut);font-weight:700;padding:6px 8px 2px}
.nav a{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;color:#c4ccd1;text-decoration:none;font-weight:600;font-size:15px;border:1px solid transparent;cursor:pointer}
.nav a.on{background:rgba(255,255,255,.05);border-color:var(--line);color:#fff;box-shadow:inset 3px 0 0 var(--acc)}
.nav a svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sp{flex:1}
.lang{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:14px;padding:4px}
.lang button{background:none;border:0;color:var(--mut);padding:9px;border-radius:10px;font-weight:700;cursor:pointer;font:inherit}.lang button.on{background:rgba(255,255,255,.08);color:#fff}
main{padding:34px clamp(16px,4vw,48px);max-width:980px;width:100%}
.panel{border:1px solid var(--line);border-radius:26px;background:var(--card);padding:clamp(18px,3vw,32px)}
h1{margin:0 0 6px;font-size:clamp(22px,3vw,30px)}.sub{color:var(--mut);margin:0 0 22px;font-size:14px}
.fiche{border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:22px}
.fiche small{display:block;font-size:10.5px;letter-spacing:.14em;font-weight:700;color:var(--mut)}.fiche strong{display:block;font-size:18px;margin:6px 0 2px}.fiche code{font-size:13px;color:var(--mut);display:block}
label.l{display:block;margin:18px 0 8px;font-size:11px;letter-spacing:.14em;font-weight:800;color:var(--acc)}
.hint{font-size:12.5px;color:var(--mut);margin:-4px 0 8px}
input,select{width:100%;padding:15px 16px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--txt);font:inherit;font-size:15px}
.ph{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.6fr);gap:10px}
.btn{width:100%;margin-top:18px;padding:16px;border-radius:14px;border:1px solid var(--line);background:transparent;color:var(--txt);font:inherit;font-weight:700;font-size:15px;cursor:pointer}
.btn.pri{background:linear-gradient(135deg,#6ff2cf,var(--acc2));color:#04110d;border-color:transparent}.btn:disabled{opacity:.55;cursor:wait}
.msg{margin-top:14px;font-size:14px;min-height:20px}.msg.ok{color:var(--acc)}.msg.err{color:var(--err)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:18px}
.stat{border:1px solid var(--line);border-radius:18px;padding:18px}.stat small{color:var(--mut);font-size:12px;font-weight:600}.stat b{display:block;font-size:28px;margin-top:6px}
.note{border:1px solid rgba(94,234,180,.25);background:rgba(94,234,180,.05);border-radius:16px;padding:14px 16px;font-size:14px;color:#cfeee6;margin-bottom:16px}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}.row span:first-child{color:var(--mut)}
.danger{margin-top:28px;padding-top:20px;border-top:1px solid var(--line)}.danger h2{margin:0 0 6px;font-size:18px}.btn.dng{border-color:rgba(255,138,138,.45);color:var(--err)}.btn.dng:not(:disabled):hover{background:rgba(255,138,138,.08)}a.btn{display:block;text-align:center;text-decoration:none}
/* dvmobile */
@media(max-width:820px){
html,body{overflow-x:hidden}
.app{display:block}.app>*{min-width:0}
.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 12px;align-items:center}
.side>.brand:first-child{grid-column:1;grid-row:1;font-size:16px;padding:0}
.side>.brand:first-child img{width:32px;height:32px}
.lang{grid-column:2;grid-row:1}.lang button{padding:7px 10px;font-size:13px}
.ucard{grid-column:1/-1;grid-row:2;padding:10px 12px}
.urow img{width:38px;height:38px}
#homeLink,.sp,.nav-h{display:none}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;gap:2px;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));background:rgba(8,12,16,.97);border-top:1px solid var(--line);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.nav a{flex:1;min-width:0;flex-direction:column;justify-content:center;gap:4px;padding:8px 4px;font-size:11px;text-align:center;border-radius:12px;box-shadow:none}
.nav a.on{box-shadow:none;background:rgba(94,234,180,.12);color:var(--acc);border-color:transparent}
.nav a svg{width:22px;height:22px}
main{padding:16px 12px calc(92px + env(safe-area-inset-bottom,0px));max-width:100%}
.panel{border-radius:20px;padding:16px}
input,select{font-size:16px;padding:13px 14px}
.ph{grid-template-columns:1fr}
.stat b{font-size:24px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <a class="brand" href="/"><img src="icons/doberto-vcf-192.png" alt="" />DOBERTO VCF</a>
    <div class="ucard"><div class="urow"><img id="uAv" alt="" src="icons/doberto-vcf-192.png" /><div><b id="uName"></b><span id="uMail"></span></div></div><span class="chip off" id="uChip"></span></div>
    <nav class="nav" id="nav"></nav>
    <div class="sp"></div>
    <a class="brand" style="font-weight:600;font-size:15px;color:var(--mut)" href="/" id="homeLink"></a>
    <div class="lang" id="lang"><button data-l="ht">KR</button><button data-l="fr">FR</button><button data-l="en">EN</button></div>
  </aside>
  <main><div class="panel" id="view"></div></main>
</div>
<script src="js/countries.js"></script>

  };
  var ICON = {
    overview:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>',
    profile:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>',
    auto:'<svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>',
    account:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3 1a7 7 0 0 0-2-1.2L14 3h-4l-.6 2.7a7 7 0 0 0-2 1.2l-2.3-1-2 3.4 2 1.5A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.5 2 3.4 2.3-1a7 7 0 0 0 2 1.2L10 21h4l.6-2.7a7 7 0 0 0 2-1.2l2.3 1 2-3.4-2-1.5c.1-.4.1-.8.1-1.2z"/></svg>'
  };
  var S = { lang: 'ht', tab: 'overview', session: null, reg: null, prefix: '', total: 0, conn: null, busy: false, auto: false };
  var $ = function (id) { return document.getElementById(id); };

  function t(k) { return T[S.lang][k] || T.ht[k] || ''; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function token() { try { return localStorage.getItem(TOKEN_KEY) || ''; } catch (_) { return ''; } }
  function api(method, path, body) {
    return fetch(path, { method: method, cache: 'no-store',
      headers: Object.assign({ Authorization: 'Bearer ' + token(), Accept: 'application/json' }, body ? { 'Content-Type': 'application/json' } : {}),
      body: body ? JSON.stringify(body) : undefined
    }).then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { return { ok: r.ok, status: r.status, data: d }; }); });
  }
  function connOn(c) {
    if (!c) return false;
    var s = String(c.status || '').toLowerCase();
    if (s.indexOf('reauth') !== -1 || s === 'revoked' || s === 'expired') return false;
    return c.connected === true || s === 'connected' || s === 'active';
  }
  function dialOpts(sel) {
    var h = '';
    if (typeof COUNTRIES !== 'undefined') COUNTRIES.forEach(function (c) { h += '<option value="' + esc(c.dial) + '"' + (String(c.dial) === String(sel) ? ' selected' : '') + '>' + esc(c.name) + ' (+' + esc(c.dial) + ')</option>'; });
    return h;
  }
  function countryOf(sel) { var o = sel.options[sel.selectedIndex]; return o ? o.textContent.replace(/\s*\(\+\d+\)\s*$/, '') : ''; }
  function say(text, kind) { var m = $('msg'); if (m) { m.textContent = text || ''; m.className = 'msg ' + (kind || ''); } }
  function fmt(d, p) { return d && p ? '+' + d + ' ' + p : t('none'); }
  function lastSyncLabel() {
    var at = 0; try { at = Number(localStorage.getItem(LAST_KEY)) || 0; } catch (_) {}
    if (!at) return '';
    var d = new Date(at), p = function (n) { return n < 10 ? '0' + n : '' + n; };
    return t('lastSync') + ' · ' + p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function chrome() {
    var u = S.session.user || {};
    $('uName').textContent = u.name || (S.reg && S.reg.name) || '';
    $('uMail').textContent = u.email || '';
    if (u.avatarUrl) $('uAv').src = u.avatarUrl;
    $('uAv').onerror = function () { this.onerror = null; this.src = 'icons/doberto-vcf-192.png'; };
    var on = connOn(S.conn);
    $('uChip').textContent = on ? t('on') : t('off'); $('uChip').className = 'chip' + (on ? '' : ' off');
    $('homeLink').textContent = t('home');
    var items = [['overview'], ['profile'], ['auto']];
    var h = '<div class="nav-h">' + esc(t('overview').toUpperCase()) + '</div>';
    items.forEach(function (i) { h += '<a data-tab="' + i[0] + '" class="' + (S.tab === i[0] ? 'on' : '') + '">' + ICON[i[0]] + t(i[0]) + '</a>'; });
    h += '<div class="nav-h">' + esc(t('manage')) + '</div><a data-tab="account" class="' + (S.tab === 'account' ? 'on' : '') + '">' + ICON.account + t('account') + '</a>';
    $('nav').innerHTML = h;
    Array.prototype.forEach.call($('nav').querySelectorAll('a[data-tab]'), function (a) { a.addEventListener('click', function () { go(a.getAttribute('data-tab')); }); });
    Array.prototype.forEach.call($('lang').querySelectorAll('button'), function (b) {
      b.className = b.getAttribute('data-l') === S.lang ? 'on' : '';
      b.onclick = function () { S.lang = b.getAttribute('data-l'); try { localStorage.setItem('doberto_lang', S.lang); } catch (_) {} document.documentElement.lang = S.lang; render(); };
    });
  }

  function fichePreview() {
    var r = S.reg, h = '<div class="fiche"><small>' + t('fiche') + '</small><strong>' + esc((S.prefix ? S.prefix + ' ' : '') + r.name) + '</strong><code>' + esc(fmt(r.dial_code, r.phone)) + '</code>';
    if (r.phone2) h += '<code>' + esc(fmt(r.dial_code2, r.phone2)) + '</code>';
    return h + '</div>';
  }

  function vOverview() {
    var r = S.reg;
    return '<h1>' + t('ovT') + '</h1><p class="sub">' + t('ovS') + '</p>' +
      '<div class="grid"><div class="stat"><small>' + t('members') + '</small><b>' + esc(S.total) + '</b></div>' +
      '<div class="stat"><small>' + t('gc') + '</small><b style="font-size:20px;margin-top:12px">' + (connOn(S.conn) ? t('connected') : t('notConn')) + '</b></div></div>' +
      fichePreview() +
      (r.phone2 ? '' : '<button class="btn" id="goSecond">' + t('addSecond') + '</button>');
  }

  function vProfile() {
    var r = S.reg;
    return '<h1>' + t('pT') + '</h1><p class="sub">' + t('pS') + '</p>' + fichePreview() +
      '<label class="l">' + t('name') + '</label><input id="fName" maxlength="100" value="' + esc(r.name) + '" />' +
      '<label class="l">' + t('num') + '</label><div class="hint">' + t('numH') + '</div><div class="ph"><select id="fD1">' + dialOpts(r.dial_code) + '</select><input id="fP1" type="tel" inputmode="numeric" placeholder="' + esc(t('ph')) + '" value="' + esc(r.phone) + '" /></div>' +
      '<label class="l">' + t('num2') + '</label><div class="hint">' + t('num2H') + '</div><div class="ph"><select id="fD2">' + dialOpts(r.dial_code2 || r.dial_code) + '</select><input id="fP2" type="tel" inputmode="numeric" placeholder="' + esc(t('ph')) + '" value="' + esc(r.phone2 || '') + '" /></div>' +
      '<button class="btn pri" id="fSave">' + t('save') + '</button><button class="btn" id="fCancel">' + t('cancel') + '</button><div class="msg" id="msg" role="status"></div>';
  }
  function bindProfile() {
    $('fCancel').onclick = function () { go('overview'); };
    $('fSave').onclick = function () {
      var b = $('fSave'); b.disabled = true; say('');
      api('PUT', '/api/registration', { name: $('fName').value, dialCode: $('fD1').value, phone: $('fP1').value, countryName: countryOf($('fD1')), dialCode2: $('fD2').value, phone2: $('fP2').value }).then(function (res) {
        if (res.ok && res.data && res.data.registration) { S.reg = res.data.registration; render(); say(t('saved'), 'ok'); }
        else { say((res.data && res.data.error) || t('err'), 'err'); b.disabled = false; }
      }).catch(function () { say(t('err'), 'err'); b.disabled = false; });
    };
  }

  function vAuto() {
    var on = connOn(S.conn), reauth = S.conn && !on && /reauth|revoked|expired/i.test(String(S.conn.status || ''));
    var h = '<h1>' + t('aT') + '</h1><p class="sub">' + t('aS') + '</p>';
    if (on) h += '<div class="note">' + t('autoNote') + '</div>';
    if (!on) h += '<div class="note">' + t('shizzyNote') + '</div>';
    h += on ? '<button class="btn pri" id="bSync">' + t('resync') + '</button><button class="btn" id="bDisc">' + t('disc') + '</button>'
            : '<button class="btn pri" id="bConn">' + t('connect') + '</button>' + (reauth ? '<button class="btn" id="bDisc">' + t('disc') + '</button>' : '');
    return h + '<div class="msg" id="msg" role="status"></div>';
  }
  function setBusy(v) { S.busy = v; Array.prototype.forEach.call(document.querySelectorAll('#view .btn'), function (b) { b.disabled = v; }); }
  function poll(id, n) {
    api('GET', '/api/shizzy/jobs/' + encodeURIComponent(id)).then(function (res) {
      var job = res.ok && res.data && res.data.job; if (!job) { say(t('err'), 'err'); setBusy(false); return; }
      var st = String(job.status || '').toLowerCase();
      if (st === 'completed') { var s = job.stats || {}; try { localStorage.setItem(LAST_KEY, String(Date.now())); } catch (_) {}
        say(t('doneS') + ': ' + (s.created || 0) + ' ' + t('created') + ', ' + (s.updated || 0) + ' ' + t('updated') + ', ' + (s.failed || 0) + ' ' + t('failed') + '.', 'ok'); setBusy(false); }
      else if (st === 'failed' || st === 'error') { say(job.error || t('err'), 'err'); setBusy(false); }
      else if (n >= 75) { setBusy(false); }
      else setTimeout(function () { poll(id, n + 1); }, 4000);
    }).catch(function () { say(t('err'), 'err'); setBusy(false); });
  }
  function bindAuto() {
    var c = $('bConn'), sy = $('bSync'), d = $('bDisc');
    if (sy) { var l = lastSyncLabel(); if (l) say(l, 'ok');
      sy.onclick = function () { if (S.busy) return; setBusy(true); say(t('syncing'), 'ok');
        api('POST', '/api/shizzy/sync').then(function (res) {
          if (res.ok && res.data && res.data.jobId) { poll(res.data.jobId, 0); return; }
          say((res.data && res.data.error) || t('err'), 'err'); setBusy(false);
        }).catch(function () { say(t('err'), 'err'); setBusy(false); }); }; }
    if (c) c.onclick = function () { if (S.busy) return; setBusy(true); say(t('redirecting'), 'ok');
      api('POST', '/api/shizzy/connect').then(function (res) {
        if (res.ok && res.data && /^https:\/\//i.test(res.data.url || '')) { window.location.href = res.data.url; return; }
        say((res.data && res.data.error) || t('err'), 'err'); setBusy(false);
      }).catch(function () { say(t('err'), 'err'); setBusy(false); }); };
    if (d) d.onclick = function () { if (S.busy || !window.confirm(t('confirmD'))) return; setBusy(true);
      api('DELETE', '/api/shizzy/connection').then(function (res) {
        if (res.ok) { S.conn = null; render(); say(t('discOk'), 'ok'); } else { say((res.data && res.data.error) || t('err'), 'err'); setBusy(false); }
      }).catch(function () { say(t('err'), 'err'); setBusy(false); }); };
  }

  function vAccount() {
    return '<h1>' + t('acT') + '</h1><p class="sub">' + t('acS') + '</p>' +
      '<div class="row"><span>' + t('email') + '</span><strong>' + esc((S.session.user || {}).email || '') + '</strong></div>' +
      '<div class="row"><span>' + t('fiche') + '</span><strong>' + esc((S.prefix ? S.prefix + ' ' : '') + S.reg.name) + '</strong></div>' +
      '<button class="btn" id="bOut">' + t('logout') + '</button>' +
      '<a class="btn" href="report.html">' + t('reportLink') + '</a>' +
      '<div class="danger"><h2>' + t('delT') + '</h2><p class="hint">' + t('delP') + '</p>' +
      '<button class="btn dng" id="bDelAsk">' + t('delBtn') + '</button>' +
      '<div id="delBox" style="display:none"><label class="l">' + t('delType') + '</label><input id="delInput" autocomplete="off" autocapitalize="characters" />' +
      '<button class="btn dng" id="bDelGo" disabled>' + t('delGo') + '</button></div>' +
      '<div class="msg" id="msg" role="status"></div></div>';
  }
  function bindDelete() {
    var ask = $('bDelAsk'), box = $('delBox'), inp = $('delInput'), go = $('bDelGo');
    ask.onclick = function () { box.style.display = 'block'; ask.style.display = 'none'; inp.focus(); };
    inp.oninput = function () { go.disabled = inp.value.trim().toUpperCase() !== t('delWord'); };
    go.onclick = function () {
      if (S.busy || go.disabled) return;
      S.busy = true; go.disabled = true; say('');
      api('DELETE', '/api/account', { confirm: true }).then(function (res) {
        if (res.ok) {
          try { localStorage.removeItem(TOKEN_KEY); localStorage.removeItem('dv_registered'); localStorage.removeItem(LAST_KEY); } catch (_) {}
          say(t('delDone'), 'ok');
          setTimeout(function () { location.href = '/'; }, 1500);
        } else { S.busy = false; go.disabled = false; say((res.data && res.data.error) || t('err'), 'err'); }
      }).catch(function () { S.busy = false; go.disabled = false; say(t('err'), 'err'); });
    };
  }

  function render() {
    chrome();
    var v = $('view');
    v.innerHTML = S.tab === 'profile' ? vProfile() : S.tab === 'auto' ? vAuto() : S.tab === 'account' ? vAccount() : vOverview();
    if (S.tab === 'profile') bindProfile();
    else if (S.tab === 'auto') bindAuto();
    else if (S.tab === 'account') { $('bOut').onclick = function () { try { localStorage.removeItem(TOKEN_KEY); localStorage.removeItem('dv_registered'); } catch (_) {} location.href = 'register.html'; }; bindDelete(); }
    else { var g = $('goSecond'); if (g) g.onclick = function () { go('profile'); }; }
  }
  function go(tab) {
    S.tab = tab;
    try { history.replaceState(null, '', 'dashboard.html?tab=' + tab); } catch (_) {}
    render();
  }

  function init() {
    try { S.lang = localStorage.getItem('doberto_lang') || 'ht'; } catch (_) {}
    if (!T[S.lang]) S.lang = 'ht';
    document.documentElement.lang = S.lang;
    var q = new URLSearchParams(location.search).get('tab');
    if (q && /^(overview|profile|auto|account)$/.test(q)) S.tab = q;
    if (!token()) { location.replace('register.html'); return; }
    Promise.all([api('GET', '/api/auth/session'), api('GET', '/api/stats'), api('GET', '/api/shizzy/status')]).then(function (r) {
      var se = r[0];
      if (!se.ok || !se.data || !se.data.registered || !se.data.registration) { location.replace('register.html'); return; }
      S.session = se.data; S.reg = se.data.registration;
      if (r[1].ok) { S.total = r[1].data.total || 0; S.prefix = r[1].data.namePrefix || ''; }
      if (r[2].ok && r[2].data && r[2].data.configured !== false) S.conn = r[2].data.connection || null;
      render();
    }).catch(function () { location.replace('register.html'); });
  }
  function refreshConn() {
    if (S.busy || !S.session) return;
    api('GET', '/api/shizzy/status').then(function (r) {
      if (!r.ok || !r.data || r.data.configured === false) return;
      var was = connOn(S.conn); S.conn = r.data.connection || null;
      if (connOn(S.conn) !== was) render();
    }).catch(function () {});
  }
  window.addEventListener('pageshow', function (e) { if (e.persisted) refreshConn(); });
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') refreshConn(); });
  init();
})();
</script>
</body>
</html>
