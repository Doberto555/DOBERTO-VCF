<!doctype html>
<html lang="ht">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>Siyale yon pwoblèm — DOBERTO VCF</title>
<meta name="theme-color" content="#06080b" />
<link rel="icon" type="image/png" sizes="192x192" href="icons/doberto-vcf-192.png" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root{--bg:#06080b;--card:#0c1117;--line:rgba(255,255,255,.08);--txt:#eef2f0;--mut:#8b97a0;--acc:#5eead4;--acc2:#2dd4a8;--err:#ff8a8a}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:radial-gradient(1200px 500px at 70% -10%,rgba(45,212,168,.08),transparent),var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.wrap{max-width:640px;margin:0 auto;padding:22px 16px 60px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;color:inherit;text-decoration:none}.brand img{width:36px;height:36px;border-radius:10px}
.lang{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:14px;padding:4px}
.lang button{background:none;border:0;color:var(--mut);padding:8px 11px;border-radius:10px;font:inherit;font-weight:700;cursor:pointer}.lang button.on{background:rgba(255,255,255,.08);color:#fff}
.panel{border:1px solid var(--line);border-radius:26px;background:var(--card);padding:clamp(18px,3vw,30px)}
h1{margin:0 0 6px;font-size:clamp(22px,3vw,30px)}.sub{color:var(--mut);margin:0 0 20px;font-size:14px;line-height:1.55}
label{display:block;margin:18px 0 8px;font-size:11px;letter-spacing:.14em;font-weight:800;color:var(--acc)}
.hint{font-size:12.5px;color:var(--mut);margin:-2px 0 8px}
input,select,textarea{width:100%;padding:15px 16px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--txt);font:inherit;font-size:15px}
select option{background:#0c1117;color:var(--txt)}
textarea{min-height:130px;resize:vertical;line-height:1.5}
.count{font-size:11.5px;color:var(--mut);text-align:right;margin-top:6px}
.btn{width:100%;margin-top:20px;padding:16px;border-radius:14px;border:0;background:linear-gradient(135deg,#6ff2cf,var(--acc2));color:#04110d;font:inherit;font-weight:800;font-size:15px;cursor:pointer}.btn:disabled{opacity:.55;cursor:wait}
.msg{margin-top:14px;font-size:14px;min-height:20px;line-height:1.5}.msg.ok{color:var(--acc)}.msg.err{color:var(--err)}
.hp{position:absolute!important;left:-9999px!important;width:1px;height:1px;overflow:hidden}
.back{display:inline-block;margin-top:18px;color:var(--mut);font-size:14px;text-decoration:none}
.done{display:none;text-align:center;padding:10px 0}.done b{display:block;font-size:20px;margin-bottom:8px}.done p{color:var(--mut);line-height:1.55}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="brand" href="/"><img src="icons/doberto-vcf-192.png" alt="" />DOBERTO VCF</a>
    <div class="lang" id="lang"><button data-l="ht">KR</button><button data-l="fr">FR</button><button data-l="en">EN</button></div>
  </div>
  <div class="panel">
    <form id="form" novalidate>
      <h1 id="tT"></h1>
      <p class="sub" id="tS"></p>

      <label for="reason" id="lReason"></label>
      <select id="reason"></select>

      <label for="target" id="lTarget"></label>
      <div class="hint" id="hTarget"></div>
      <input id="target" maxlength="120" autocomplete="off" />

      <label for="details" id="lDetails"></label>
      <textarea id="details" maxlength="1000"></textarea>
      <div class="count" id="count">0 / 1000</div>

      <label for="contact" id="lContact"></label>
      <div class="hint" id="hContact"></div>
      <input id="contact" maxlength="120" autocomplete="off" />

      <div class="hp" aria-hidden="true"><label for="website">Website</label><input id="website" tabindex="-1" autocomplete="off" /></div>

      <button class="btn" id="send" type="submit"></button>
      <div class="msg" id="msg" role="status"></div>
    </form>
    <div class="done" id="done"><b id="dT"></b><p id="dP"></p></div>
    <a class="back" href="/" id="back"></a>
  </div>
</div>
<script>
(function () {
  'use strict';
  var TOKEN_KEY = 'dv_auth_token';
  var T = {
    ht: { title:'Siyale yon pwoblèm', sub:'Siyale yon pwofil ki fo, spam, arasman, oswa yon pwoblèm ak done pèsonèl ou. Nou li tout siyalman yo.',
      reason:'REZON', target:'MANM OSWA PWOBLÈM', targetH:'Non manm nan jan li parèt nan lis la (si gen youn), oswa non paj la.', details:'DETAY', contact:'JWENN OU (OPSYONÈL)', contactH:'Imèl oswa nimewo si ou vle yon repons. Pa obligatwa.',
      send:'Voye siyalman an', back:'← Retounen nan Akèy', short:'Ekri omwen 10 karaktè nan detay yo.', err:'Nou pa t kapab voye siyalman an. Eseye ankò.', sending:'Ap voye...',
      doneT:'Mèsi, nou resevwa l.', doneP:'N ap li siyalman ou a epi aji si sa nesesè.',
      r:{ fake:'Pwofil fo oswa moun k ap fè enpòtans', spam:'Spam oswa piblisite', harassment:'Arasman oswa mesaj ki deranje', privacy:'Done pèsonèl mwen ekspoze', bug:'Pwoblèm teknik', other:'Lòt' } },
    fr: { title:'Signaler un problème', sub:'Signalez un faux profil, du spam, du harcèlement ou un souci avec vos données personnelles. Nous lisons tous les signalements.',
      reason:'MOTIF', target:'MEMBRE OU PROBLÈME', targetH:'Nom du membre tel qu’il apparaît dans la liste (s’il y en a un), ou nom de la page.', details:'DÉTAILS', contact:'VOS COORDONNÉES (FACULTATIF)', contactH:'E-mail ou numéro si vous souhaitez une réponse. Pas obligatoire.',
      send:'Envoyer le signalement', back:'← Retour à l’accueil', short:'Écrivez au moins 10 caractères dans les détails.', err:'Impossible d’envoyer le signalement. Réessayez.', sending:'Envoi...',
      doneT:'Merci, bien reçu.', doneP:'Nous lisons votre signalement et agissons si nécessaire.',
      r:{ fake:'Faux profil ou usurpation', spam:'Spam ou publicité', harassment:'Harcèlement ou messages gênants', privacy:'Mes données personnelles sont exposées', bug:'Problème technique', other:'Autre' } },
    en: { title:'Report a problem', sub:'Report a fake profile, spam, harassment, or an issue with your personal data. We read every report.',
      reason:'REASON', target:'MEMBER OR ISSUE', targetH:'The member’s name as shown in the list (if any), or the page name.', details:'DETAILS', contact:'HOW TO REACH YOU (OPTIONAL)', contactH:'Email or number if you want a reply. Not required.',
      send:'Send report', back:'← Back to home', short:'Write at least 10 characters in the details.', err:'We could not send the report. Please try again.', sending:'Sending...',
      doneT:'Thank you, we got it.', doneP:'We are reviewing your report and will act if needed.',
      r:{ fake:'Fake profile or impersonation', spam:'Spam or advertising', harassment:'Harassment or unwanted messages', privacy:'My personal data is exposed', bug:'Technical problem', other:'Other' } }
  };
  var ORDER = ['fake', 'spam', 'harassment', 'privacy', 'bug', 'other'];
  var lang = 'ht';
  var $ = function (id) { return document.getElementById(id); };
  function t(k) { return (T[lang] && T[lang][k]) || T.ht[k] || ''; }

  function apply() {
    document.documentElement.lang = lang;
    document.title = t('title') + ' — DOBERTO VCF';
    $('tT').textContent = t('title'); $('tS').textContent = t('sub');
    $('lReason').textContent = t('reason'); $('lTarget').textContent = t('target'); $('hTarget').textContent = t('targetH');
    $('lDetails').textContent = t('details'); $('lContact').textContent = t('contact'); $('hContact').textContent = t('contactH');
    $('send').textContent = t('send'); $('back').textContent = t('back'); $('dT').textContent = t('doneT'); $('dP').textContent = t('doneP');
    var sel = $('reason'), cur = sel.value;
    sel.innerHTML = '';
    ORDER.forEach(function (k) { var o = document.createElement('option'); o.value = k; o.textContent = T[lang].r[k]; sel.appendChild(o); });
    if (cur) sel.value = cur;
    Array.prototype.forEach.call($('lang').querySelectorAll('button'), function (b) { b.className = b.getAttribute('data-l') === lang ? 'on' : ''; });
  }
  function say(text, kind) { var m = $('msg'); m.textContent = text || ''; m.className = 'msg ' + (kind || ''); }

  try { var s = localStorage.getItem('doberto_lang'); if (T[s]) lang = s; } catch (_) {}
  var pre = new URLSearchParams(location.search).get('target');
  if (pre) $('target').value = pre.slice(0, 120);
  Array.prototype.forEach.call($('lang').querySelectorAll('button'), function (b) {
    b.onclick = function () { lang = b.getAttribute('data-l'); try { localStorage.setItem('doberto_lang', lang); } catch (_) {} apply(); };
  });
  $('details').addEventListener('input', function () { $('count').textContent = this.value.length + ' / 1000'; });
  apply();

  $('form').addEventListener('submit', function (e) {
    e.preventDefault();
    var details = $('details').value.trim();
    if (details.length < 10) { say(t('short'), 'err'); return; }
    var btn = $('send'); btn.disabled = true; btn.textContent = t('sending'); say('');
    var tok = ''; try { tok = localStorage.getItem(TOKEN_KEY) || ''; } catch (_) {}
    var headers = { 'Content-Type': 'application/json', Accept: 'application/json' };
    if (tok) headers.Authorization = 'Bearer ' + tok;
    fetch('/api/report', { method: 'POST', headers: headers, body: JSON.stringify({
      reason: $('reason').value, target: $('target').value, details: details, contact: $('contact').value, website: $('website').value
    }) }).then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { return { ok: r.ok, data: d }; }); })
      .then(function (res) {
        if (res.ok) { $('form').style.display = 'none'; $('done').style.display = 'block'; return; }
        say((res.data && res.data.error) || t('err'), 'err'); btn.disabled = false; btn.textContent = t('send');
      }).catch(function () { say(t('err'), 'err'); btn.disabled = false; btn.textContent = t('send'); });
  });
})();
</script>
</body>
</html>
