<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#020705" />
<title>DOBERTO VCF — Offline</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="icon" type="image/png" sizes="192x192" href="icons/doberto-vcf-192.png" />
<style>
:root{color-scheme:dark}*{box-sizing:border-box;font-family:'Inter',system-ui,sans-serif;font-style:normal}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(620px 360px at 50% 16%,rgba(33,227,155,.13),transparent 68%),linear-gradient(180deg,#020705,#010403);color:#f4faf7;padding:24px}.card{width:min(470px,100%);padding:34px 30px;border:1px solid rgba(83,230,170,.16);border-radius:26px;background:linear-gradient(180deg,rgba(9,24,17,.94),rgba(4,12,8,.97));box-shadow:0 28px 90px rgba(0,0,0,.45);text-align:center}.logo-shell{width:92px;height:92px;margin:0 auto 22px;display:grid;place-items:center;border:1px solid rgba(83,230,170,.19);border-radius:26px;background:rgba(24,74,53,.22);box-shadow:0 0 42px rgba(33,227,155,.12)}.logo{width:64px;height:64px}h1{margin:0 0 10px;font-size:30px;line-height:1.08;letter-spacing:-.035em;font-weight:700}p{margin:0 auto 24px;color:#91a59c;line-height:1.7;max-width:350px;font-size:14px}button{width:100%;min-height:50px;border:0;border-radius:14px;background:linear-gradient(135deg,#5af2b8,#18d995);color:#052018;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 14px 34px rgba(33,227,155,.16)}.small{font-size:11px;margin-top:17px;color:#65776f;letter-spacing:.05em;text-transform:uppercase}
</style>
</head>
<body>
<main class="card">
  <div class="logo-shell"><img class="logo" src="icons/doberto-vcf-mark.svg" alt="DOBERTO VCF" /></div>
  <h1 id="offlineTitle">Ou offline kounye a</h1>
  <p id="offlineDesc">DOBERTO VCF ka toujou louvri, men enskripsyon, lis aktyèl la ak download VCF bezwen yon koneksyon entènèt.</p>
  <button id="offlineBtn" type="button" onclick="location.reload()">Eseye konekte ankò</button>
  <div class="small">Offline mode · DOBERTO VCF</div>
</main>
<script>
(function(){
  const copy={
    ht:{title:'Ou offline kounye a',desc:'DOBERTO VCF ka toujou louvri, men enskripsyon, lis aktyèl la ak download VCF bezwen yon koneksyon entènèt.',btn:'Eseye konekte ankò'},
    fr:{title:'Vous êtes hors ligne',desc:'DOBERTO VCF peut toujours s’ouvrir, mais l’inscription, la liste actuelle et le téléchargement VCF nécessitent une connexion Internet.',btn:'Réessayer la connexion'},
    en:{title:'You are offline',desc:'DOBERTO VCF can still open, but registration, the current member list and VCF downloads require an Internet connection.',btn:'Try connecting again'}
  };
  let lang='ht';
  try{const saved=localStorage.getItem('doberto_lang');if(copy[saved])lang=saved;}catch(_){}
  document.documentElement.lang=lang;
  document.getElementById('offlineTitle').textContent=copy[lang].title;
  document.getElementById('offlineDesc').textContent=copy[lang].desc;
  document.getElementById('offlineBtn').textContent=copy[lang].btn;
})();
</script>
</body>
</html>
