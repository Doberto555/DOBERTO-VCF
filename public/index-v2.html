<style>

*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{font:16px/1.6 Inter,system-ui,"Segoe UI",sans-serif;background:radial-gradient(1100px 520px at 75% -8%,rgba(54,231,167,.10),transparent),var(--ink);color:var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
.wrap{width:min(1180px,100% - 40px);margin-inline:auto}
.hl{color:var(--sun)}
.eyebrow{display:flex;align-items:center;gap:12px;color:var(--sun);font-size:12px;font-weight:800;letter-spacing:.16em;margin-bottom:18px}
.eyebrow::before{content:"";width:34px;height:1px;background:var(--sun)}
h2{font-size:clamp(30px,4.6vw,52px);line-height:1.08;letter-spacing:-.03em;font-weight:800;max-width:900px}
.sub{color:var(--muted);font-size:18px;max-width:640px;margin-top:16px}
section{padding:84px 0}
/* nav */
.nav{position:sticky;top:0;z-index:50;background:rgba(4,16,11,.84);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:22px;height:72px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:.01em}
.brand img{width:36px;height:36px;border-radius:10px;display:block}
.links{display:flex;gap:26px;margin-left:14px;font-weight:600;color:#bcd0c6}
.links a:hover{color:#fff}
.sp{flex:1}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:14px;padding:4px;gap:2px}
.lang button{padding:7px 12px;border:0;border-radius:10px;background:none;color:var(--muted);font-weight:700;font-size:13px;cursor:pointer}
.lang button.on{background:rgba(255,255,255,.09);color:var(--text)}
.nlogin{font-weight:600;color:#cfe0d7}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:15px 26px;border-radius:16px;font-weight:800;border:1px solid var(--line);cursor:pointer}
.btn.light{background:var(--text);color:var(--ink);border-color:transparent}
.btn.light:hover{background:#fff}
.btn.ghost{background:var(--panel);color:var(--text)}
.btn.ghost:hover{border-color:rgba(54,231,167,.4)}
.btn.sm{padding:11px 18px;border-radius:14px}
.arrow::after{content:"→"}
.btn{white-space:nowrap}
.have{color:var(--muted);font-size:14px;margin-top:10px}.have a{font-weight:700;color:var(--signal)}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--signal);outline-offset:3px}
/* hero */
.hero{padding:70px 0 40px}
.hgrid{display:grid;grid-template-columns:1.15fr 1fr;gap:48px;align-items:center}
.live{display:inline-flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 18px 7px 8px;font-size:14px;color:#cfe0d7;margin-bottom:26px;max-width:100%}
.live b{background:rgba(54,231,167,.14);color:var(--signal);border-radius:999px;padding:4px 12px;font-size:12px;letter-spacing:.06em}
h1{font-size:clamp(40px,6.6vw,84px);line-height:1.02;letter-spacing:-.035em;font-weight:800}
.lead{color:var(--muted);font-size:19px;max-width:560px;margin-top:24px}
.cta{display:flex;gap:14px;flex-wrap:wrap;margin-top:34px}
.trust{color:var(--muted);font-size:14px;margin-top:22px}
.trust::before{content:"✓ ";color:var(--signal)}
.mock{border:1px solid var(--line);border-radius:26px;background:var(--panel);overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.mh{display:flex;align-items:center;gap:8px;padding:16px 20px;border-bottom:1px solid var(--line)}
.mh i{width:11px;height:11px;border-radius:50%;background:#26382f;display:block}
.mh b{margin-left:8px;font-size:15px}
.tag{margin-left:auto;font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--sun);border:1px solid rgba(245,196,81,.35);border-radius:10px;padding:5px 10px}
.mrows{padding:10px}
.mrow,.lrow{display:flex;align-items:center;gap:14px;padding:13px 14px;border-radius:16px}
.mrow.first{border:1px solid rgba(245,196,81,.35);background:rgba(245,196,81,.05)}
.av{flex:none;width:44px;height:44px;border-radius:50%;background:#10241b;display:grid;place-items:center;font-weight:800}
.first .av{background:var(--sun);color:#1b1500}
.mw{min-width:0}.mw b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mw small{color:var(--muted);font-size:13px}
.bdg{margin-left:auto;font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--sun);background:rgba(245,196,81,.12);border-radius:10px;padding:5px 10px}
.mf{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:15px 22px;border-top:1px solid var(--line);font-size:14px}
.mf .ok{color:var(--signal);font-weight:600}.mf .ok::before{content:"● ";font-size:10px}
.mf .mu{color:var(--muted)}
.sk .av,.sk .mw b,.sk .mw small{background:#10241b;color:transparent;border-radius:8px;animation:pl 1.2s infinite ease-in-out}
.sk .mw b{width:120px;height:14px;margin-bottom:6px}.sk .mw small{display:block;width:70px;height:10px}
@keyframes pl{50%{opacity:.45}}
/* live */
.lgrid{display:grid;grid-template-columns:1.15fr 1fr;gap:16px;margin-top:40px}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:28px}
.stat small{display:block;color:var(--muted);font-size:12px;font-weight:800;letter-spacing:.14em}
.stat strong{display:block;font-size:56px;line-height:1.1;font-weight:800;letter-spacing:-.03em;margin-top:10px;font-variant-numeric:tabular-nums}
.lhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.lhead b{font-size:18px}
.lhead span{color:var(--signal);font-size:12px;font-weight:800;letter-spacing:.12em}.lhead span::before{content:"● ";font-size:10px}
.lrow{border-top:1px solid var(--line);border-radius:0;padding:14px 4px}
.lrow:first-of-type{border-top:0}
.lrow .av{width:40px;height:40px;font-size:15px}
.lrow .rt{margin-left:auto;color:var(--muted);font-size:13px;text-align:right;white-space:nowrap}
.empty{color:var(--muted);padding:20px 4px}
.refrow{display:flex;align-items:center;justify-content:flex-end;gap:12px;color:var(--muted);font-size:14px;margin-top:-30px}
.ref{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:18px}
.ref:hover{border-color:rgba(54,231,167,.4)}
/* steps */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:44px}
.step .no{display:flex;align-items:center;gap:14px;color:var(--muted);font-family:ui-monospace,Consolas,monospace;font-size:14px;letter-spacing:.14em}
.ic{width:52px;height:52px;border-radius:15px;border:1px solid rgba(245,196,81,.4);display:grid;place-items:center}
.ic svg{width:24px;height:24px;fill:none;stroke:var(--sun);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.step h3,.fc h3{font-size:22px;letter-spacing:-.02em;margin:22px 0 10px}
.step p,.fc p{color:var(--muted)}
.chip{display:inline-block;margin-top:20px;border:1px solid var(--line);border-radius:12px;padding:8px 14px;color:#cfe0d7;font-size:14px}
/* features */
.f1{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;margin-top:44px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.fc .ic{margin-bottom:6px}
.fc.row{display:flex;gap:18px}.fc.row h3{margin-top:0}
.checks{list-style:none;padding:0;margin-top:22px;display:grid;gap:12px}
.checks li{display:flex;gap:12px;color:#cfe0d7}.checks li::before{content:"✓";color:var(--sun);font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.chips span{border:1px solid var(--line);border-radius:12px;padding:7px 12px;font-size:13px;color:#cfe0d7;font-family:ui-monospace,Consolas,monospace}
/* why */
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}
.wcard{display:grid;gap:12px}
.wr{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-radius:16px;padding:16px 18px;background:rgba(255,255,255,.02)}
.wr::before{content:"✓";flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(54,231,167,.14);color:var(--signal);font-weight:800}
.wr.res{border-color:rgba(54,231,167,.4);color:var(--signal);font-weight:700}
/* faq */
.faq{column-count:2;column-gap:14px;margin-top:40px}
details{break-inside:avoid;border:1px solid var(--line);border-radius:18px;background:var(--panel);padding:0 22px;margin-bottom:14px}
summary{cursor:pointer;list-style:none;padding:20px 0;font-weight:700;display:flex;justify-content:space-between;gap:14px}
summary::-webkit-details-marker{display:none}
summary::after{content:"⌄";color:var(--muted);transition:transform .2s}
details[open] summary::after{transform:rotate(180deg)}
details p{color:var(--muted);padding:0 0 20px}
/* final */
.final{border:1px solid var(--line);border-radius:32px;padding:80px 24px;text-align:center;background:radial-gradient(700px 260px at 50% 100%,rgba(245,196,81,.07),transparent),var(--panel)}
.final .eyebrow{justify-content:center}
.final h2{margin-inline:auto}
.final .sub{margin-inline:auto}
.final .cta{justify-content:center}
/* footer */
footer{border-top:1px solid var(--line);padding:60px 0 36px;margin-top:40px}
.fg{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:32px}
.fg h4{font-size:12px;letter-spacing:.16em;color:var(--muted);margin-bottom:16px}
.fg a{display:block;color:#cfe0d7;margin-bottom:10px}.fg a:hover{color:#fff}
.fg p{color:var(--muted);margin:14px 0 10px;max-width:320px}
.cnt{font-family:ui-monospace,Consolas,monospace;color:var(--muted);font-size:14px}
.fb{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:40px;padding-top:26px;color:var(--muted);font-size:14px}
@media(max-width:1000px){.hgrid,.lgrid,.wgrid,.f1{grid-template-columns:1fr}.steps{grid-template-columns:1fr}.fg{grid-template-columns:1fr 1fr}.refrow{margin-top:14px}}
@media(max-width:900px){.links{display:none}}
@media(max-width:720px){section{padding:60px 0}.faq{column-count:1}.f2{grid-template-columns:1fr}.hero{padding-top:40px}.nav .wrap{gap:12px;height:64px}.sgrid{grid-template-columns:1fr 1fr}.stat strong{font-size:40px}.card{padding:22px}}
@media(max-width:560px){.fg{grid-template-columns:1fr}}
@media(max-width:720px){.nav .nlogin,.nav .btn.sm{display:none}.lang button{padding:7px 10px}}
@media(max-width:430px){.btn{width:100%}}
@media(max-width:340px){.brand span{display:none}}
</style>
</head>

var lang='ht',stats={},members=[],logged=false;
try{var s=localStorage.getItem('doberto_lang');if(T[s])lang=s}catch(_){}
try{logged=!!localStorage.getItem('dv_auth_token')}catch(_){}
function t(k){return (T[lang]&&T[lang][k])||T.ht[k]||''}
function $(id){return document.getElementById(id)}
function num(v){return typeof v==='number'?v.toLocaleString(lang==='en'?'en-US':'fr-FR'):'—'}
function mask(n){var p=String(n||'').trim().split(/\s+/).filter(Boolean);if(!p.length)return '—';var f=Array.from(p[0]).slice(0,16).join('');var l=Array.from(p[p.length-1])[0]||'';return (p.length>1&&/\p{L}/u.test(l))?f+' '+l.toUpperCase()+'.':f}
function country(m){return String(m.country_name||m.countryName||'').split('(')[0].trim()}
function ago(ts){var d=Date.parse(ts);if(!d)return '';var m=Math.max(1,Math.round((Date.now()-d)/60000)),u=t('ago');if(m<60)return m+' '+u[0];var h=Math.round(m/60);if(h<24)return h+u[1];return Math.round(h/24)+u[2]}
function pick(d){if(Array.isArray(d))return d;if(d&&typeof d==='object'){var ks=['items','members','list','data','rows','registrations','results'];for(var i=0;i<ks.length;i++)if(Array.isArray(d[ks[i]]))return d[ks[i]]}return []}
function mk(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function initial(n){return (Array.from(String(n||'?').trim())[0]||'?').toUpperCase()}

function renderMock(){
  var box=$('mRows');box.innerHTML='';
  if(!members.length){for(var k=0;k<5;k++){var s=mk('div','mrow sk');s.append(mk('span','av'),(function(){var w=mk('div','mw');w.append(mk('b'),mk('small'));return w})());box.appendChild(s)}return}
  members.slice(0,5).forEach(function(m,i){
    var r=mk('div','mrow'+(i===0?' first':'')),w=mk('div','mw');
    w.append(mk('b','',mask(m.name)),mk('small','',country(m)));
    r.append(mk('span','av',initial(m.name)),w);
    if(i===0)r.append(mk('span','bdg',t('mNew')));
    box.appendChild(r);
  });
}
function renderList(){
  var box=$('lRows');box.innerHTML='';
  if(!members.length){box.appendChild(mk('p','empty',t('lEmpty')));return}
  members.slice(0,6).forEach(function(m){
    var r=mk('div','lrow'),w=mk('div','mw'),rt=mk('div','rt');
    w.append(mk('b','',mask(m.name)),mk('small','',ago(m.created_at||m.createdAt)));
    rt.textContent=country(m);
    r.append(mk('span','av',initial(m.name)),w,rt);
    box.appendChild(r);
  });
}
function renderStats(){
  $('nTotal').textContent=num(stats.total);$('nCountries').textContent=num(stats.countries);
  $('nToday').textContent=num(stats.today);$('nWeek').textContent=num(stats.week);
  $('liveTxt').textContent=t('liveTxt').replace('{n}',typeof stats.total==='number'?stats.total.toLocaleString('fr-FR'):'…').replace('{c}',typeof stats.countries==='number'?stats.countries:'…');
  $('fCount').textContent=typeof stats.total==='number'?t('fCount').replace('{n}',stats.total.toLocaleString('fr-FR')):'—';
}
function renderFaq(){
  var box=$('faqBox');box.innerHTML='';
  t('faq').forEach(function(q,i){var d=mk('details');if(i===0)d.open=true;var s=mk('summary','',q[0]);d.append(s,mk('p','',q[1]));box.appendChild(d)});
}
function apply(){
  document.documentElement.lang=lang;document.title=t('title');
  document.querySelectorAll('[data-i]').forEach(function(e){e.textContent=t(e.getAttribute('data-i'))});
  document.querySelectorAll('[data-h]').forEach(function(e){e.innerHTML=t(e.getAttribute('data-h'))});
  document.querySelectorAll('.lang button').forEach(function(b){b.className=b.getAttribute('data-l')===lang?'on':''});
  if(logged){
    document.querySelectorAll('.js-login,.js-start').forEach(function(a){a.setAttribute('href','dashboard.html');a.textContent=t('dash')});
    document.querySelectorAll('.nav .nlogin').forEach(function(a){a.style.display='none'});
    var hv=document.getElementById('have');if(hv)hv.hidden=true;
  }
  renderStats();renderMock();renderList();renderFaq();
}
document.querySelectorAll('.lang button').forEach(function(b){
  b.addEventListener('click',function(){lang=b.getAttribute('data-l');try{localStorage.setItem('doberto_lang',lang)}catch(_){}apply()});
});
function jget(p){return fetch(p,{cache:'no-store',headers:{Accept:'application/json'}}).then(function(r){if(!r.ok)throw r.status;return r.json()})}
function load(){
  jget('/api/stats').then(function(d){stats=d||{};renderStats()}).catch(function(){});
  jget('/api/public-list?page=1').then(function(d){
    var l=pick(d).filter(function(m){return m&&m.name});
    l.sort(function(a,b){return (Date.parse(b.created_at||b.createdAt)||0)-(Date.parse(a.created_at||a.createdAt)||0)});
    members=l;renderMock();renderList();
  }).catch(function(){renderMock();renderList()});
}
$('refBtn').addEventListener('click',load);
setInterval(function(){if(!document.hidden)load()},45000);
apply();load();
})();
</script>
